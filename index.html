<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>极速赛马场</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="top"><div class="logo">🐎 极速赛马场</div><div id="me">未登录</div></div>
<main>
<section class="card hero">
<h1>多人实时赛马大厅</h1>
<p>纯虚拟金币娱乐模式，不涉及现金充值或提现。</p>
<div id="status">正在连接服务器…</div>
<div id="countdown"></div>
</section>

<section class="card">
<h2>🏇 本局比赛</h2>
<div id="race"></div>
<div class="betbox">
<select id="horse"><option>赤焰</option><option>闪电</option><option>风暴</option><option>黑影</option><option>黄金</option></select>
<input id="amount" type="number" min="1" max="5000" value="100">
<button onclick="placeBet()">选择并投入虚拟金币</button>
</div>
<div id="result"></div>
</section>

<section class="grid">
<div class="card"><h2>👤 我的账户</h2><div id="account">请登录</div><button onclick="showLogin()">登录</button> <button onclick="showRegister()">注册</button></div>
<div class="card"><h2>🏆 排行榜</h2><div id="rank"></div></div>
</section>

<section class="card"><h2>📜 我的比赛记录</h2><div id="history">登录后查看</div></section>
</main>

<div id="modal" class="modal hidden"><div class="modalbox"><button class="x" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码（至少6位）"><button id="modalBtn">确定</button><p id="msg"></p></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
